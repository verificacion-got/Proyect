<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Títulos - Prototipo</title>
    <style>
        /* Diseño de la interfaz (CSS) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            padding: 40px; 
            display: flex; 
            justify-content: center;
        }
        .contenedor { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        input { 
            padding: 12px; 
            width: 100%; 
            margin: 15px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 16px; 
            box-sizing: border-box; /* Evita que el input se salga del contenedor */
        }
        button { 
            background-color: #0056b3; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold;
        }
        button:hover { 
            background-color: #004494; 
        }
        #resultado { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 5px; 
            display: none; 
            text-align: left; 
        }
        .valido { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }
        .invalido { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Verificación Institucional</h2>
        <p>Ingrese el código de verificación o folio del título:</p>
        
        <!-- Campo de entrada -->
        <input type="text" id="folioInput" placeholder="Ej: AB-12345">
        
        <!-- Botón que activa la función de JavaScript -->
        <button onclick="verificarFolio()">Validar Documento</button>

        <!-- Aquí aparecerá el mensaje de éxito o error -->
        <div id="resultado"></div>
    </div>

    <script>
        /* 
           Simulación de la Base de Datos (Mock Database)
           En la vida real, esto vive en un servidor seguro (SQLite, MySQL, etc.)
           y nunca en el HTML público. Lo incluimos aquí para que el prototipo funcione.
        */
        const baseDeDatosSimulada = {
            "AB-12345": {
                nombre: "Juan Pérez",
                carrera: "Ingeniería Informática",
                fecha: "2024-12-15",
                estado: "Válido (Titulado)"
            },
            "AB-98765": {
                nombre: "María Gómez",
                carrera: "Arquitectura",
                fecha: "2023-05-10",
                estado: "Válido (Titulada)"
            }
        };

        /* Lógica del sistema (Simulación del Backend en Python) */
        function verificarFolio() {
            // 1. Capturamos lo que el usuario escribió
            const folio = document.getElementById('folioInput').value.trim();
            const divResultado = document.getElementById('resultado');
            
            // Verificamos que no esté vacío
            if (!folio) {
                alert("Por favor ingrese un folio para consultar.");
                return;
            }

            // Hacemos visible el cuadro de resultados
            divResultado.style.display = 'block';

            // 2. Consultamos la base de datos simulada
            if (baseDeDatosSimulada[folio]) {
                // Si el folio existe, extraemos sus datos
                const datos = baseDeDatosSimulada[folio];
                
                // Pintamos el cuadro de verde y mostramos la información
                divResultado.className = 'valido';
                divResultado.innerHTML = `
                    <strong>✅ Documento Auténtico</strong><br><br>
                    <strong>Titular:</strong> ${datos.nombre}<br>
                    <strong>Carrera:</strong> ${datos.carrera}<br>
                    <strong>Fecha Emisión:</strong> ${datos.fecha}<br>
                    <strong>Estado:</strong> ${datos.estado}
                `;
            } else {
                // Si el folio NO existe, pintamos de rojo y mostramos el error
                divResultado.className = 'invalido';
                divResultado.innerHTML = `
                    <strong>❌ Error:</strong> Folio no encontrado o documento inválido. Asegúrese de haber ingresado el código correctamente.
                `;
            }
        }
    </script>
</body>
</html>
