<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Verificación - Prototipo de Tesis</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e9ecef; 
            padding: 40px; 
            display: flex; 
            justify-content: center;
        }
        .contenedor { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { text-align: center; color: #333; }
        .instrucciones { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;}
        input { 
            padding: 12px; 
            width: 100%; 
            margin: 10px 0 20px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        label { font-weight: bold; color: #555; }
        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        #resultado { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 5px; 
            display: none; 
        }
        .valido { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .invalido { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-descarga {
            display: block;
            background-color: #0056b3;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-descarga:hover { background-color: #004494; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Verificación de Certificados</h2>
        <p class="instrucciones">Ingrese el Folio y el ID (RUT) que aparecen en el documento.</p>
        
        <label for="folioInput">Folio del Documento</label>
        <input type="text" id="folioInput" placeholder="Ej: 831688">
        
        <label for="rutInput">ID Alumno (RUT)</label>
        <input type="text" id="rutInput" placeholder="Ej: 12698620">
        
        <button onclick="verificarDocumento()">Validar Documento</button>

        <div id="resultado"></div>
    </div>

    <script>
        /* Base de datos simulada con el nuevo registro incluido */
        const baseDeDatosSimulada = {
            "831688": {
                rut: "12698620",
                nombre: "Claudio Morales",
                carrera: "Programa de Estudios", /* Puedes cambiar este dato */
                fecha: "2023-10-02", /* Puedes cambiar este dato */
                estado: "Válido",
                archivo: "CT-ClaudioMorales.pdf"
            },
            "AB-12345": {
                rut: "12345678-9",
                nombre: "Juan Pérez",
                carrera: "Ingeniería Informática",
                fecha: "2024-12-15",
                estado: "Válido (Titulado)"
            }
        };

        function verificarDocumento() {
            const folio = document.getElementById('folioInput').value.trim();
            const rut = document.getElementById('rutInput').value.trim();
            const divResultado = document.getElementById('resultado');
            
            if (!folio || !rut) {
                alert("Por favor, complete tanto el Folio como el ID.");
                return;
            }

            divResultado.style.display = 'block';

            if (baseDeDatosSimulada[folio]) {
                const datos = baseDeDatosSimulada[folio];
                
                if (datos.rut === rut) {
                    // Creamos el botón de descarga solo si el registro tiene un archivo asociado
                    let botonArchivo = '';
                    if (datos.archivo) {
                        botonArchivo = `<a href="${datos.archivo}" target="_blank" class="btn-descarga">📄 Ver Certificado Original</a>`;
                    }

                    divResultado.className = 'valido';
                    divResultado.innerHTML = `
                        <strong>✅ Validación Exitosa</strong><br><br>
                        <strong>Titular:</strong> ${datos.nombre}<br>
                        <strong>ID:</strong> ${datos.rut}<br>
                        <strong>Carrera:</strong> ${datos.carrera}<br>
                        <strong>Fecha Emisión:</strong> ${datos.fecha}<br>
                        <strong>Estado:</strong> ${datos.estado}
                        ${botonArchivo}
                    `;
                } else {
                    divResultado.className = 'invalido';
                    divResultado.innerHTML = `<strong>❌ Error:</strong> El ID ingresado no coincide con los registros de este folio.`;
                }
            } else {
                divResultado.className = 'invalido';
                divResultado.innerHTML = `<strong>❌ Error:</strong> Folio no encontrado.`;
            }
        }
    </script>
</body>
</html>
